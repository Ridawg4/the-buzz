spring.application.name=The-Buzz-Backend
spring.datasource.url=jdbc:mysql://localhost:3306/development
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.session.store-type=jdbc
spring.sql.init.schema-locations=optional:The-Buzz-Backend/src/main/resources/schema.sql
spring.sql.init.data-locations=optional:The-Buzz-Backend/src/main/resources/data.sql
spring.servlet.multipart.max-file-size=1GB

logging.level.org.springframework.security=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.query=OFF
