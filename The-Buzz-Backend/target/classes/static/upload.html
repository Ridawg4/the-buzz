<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>upload</title>
</head>
<body>
<form method="post" enctype="multipart/form-data" action="/api/v1/audio/recorded" id="form">
    <input type="file" name="file" id="file">
    <label>Set the resource name</label>
    <input type="text" name="resourceName" id="resourceName">
    <button>submit</button>
</form>
<script>
    const form = document.getElementById("form")
    const file = document.getElementById("file")
    const resourceName = document.getElementById("resourceName")


    form.addEventListener("submit", submitFile)

    function submitFile(e) {
        e.preventDefault()
        let data = new FormData(form)
        fetch("api/v1/audio/recorded?recordingName=" + resourceName.value, {
            method: "POST",
            body: data
        })
    }
</script>
</body>
</html>
